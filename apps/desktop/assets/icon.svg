<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <title>Top</title>
  <!-- A bot getting a pat on the head from the Top: the name is a joke about who is in charge of the bots.
       Cream tile, ink arm with a tangerine cuff, tangerine bot. The tile is a superellipse (exponent 5). -->
  <defs>
    <path id="tile" d="M100 50L100 66.8L99.8 72.1L99.6 76L99.3 79.1L98.9 81.8L98.4 84L97.9 86.1L97.2 87.9L96.4 89.5L95.6 91L94.6 92.3L93.5 93.5L92.3 94.6L91 95.6L89.5 96.4L87.9 97.2L86.1 97.9L84 98.4L81.8 98.9L79.1 99.3L76 99.6L72.1 99.8L66.8 100L50 100L33.2 100L27.9 99.8L24 99.6L20.9 99.3L18.2 98.9L16 98.4L13.9 97.9L12.1 97.2L10.5 96.4L9 95.6L7.7 94.6L6.5 93.5L5.4 92.3L4.4 91L3.6 89.5L2.8 87.9L2.1 86.1L1.6 84L1.1 81.8L0.7 79.1L0.4 76L0.2 72.1L0 66.8L0 50L0 33.2L0.2 27.9L0.4 24L0.7 20.9L1.1 18.2L1.6 16L2.1 13.9L2.8 12.1L3.6 10.5L4.4 9L5.4 7.7L6.5 6.5L7.7 5.4L9 4.4L10.5 3.6L12.1 2.8L13.9 2.1L16 1.6L18.2 1.1L20.9 0.7L24 0.4L27.9 0.2L33.2 0L50 0L66.8 0L72.1 0.2L76 0.4L79.1 0.7L81.8 1.1L84 1.6L86.1 2.1L87.9 2.8L89.5 3.6L91 4.4L92.3 5.4L93.5 6.5L94.6 7.7L95.6 9L96.4 10.5L97.2 12.1L97.9 13.9L98.4 16L98.9 18.2L99.3 20.9L99.6 24L99.8 27.9L100 33.2Z"/>
    <clipPath id="clip"><use href="#tile"/></clipPath>
  </defs>
  <use href="#tile" fill="#f3f0e6"/>
  <!-- A hairline, so the cream tile keeps its edge on a light desktop. The drawing covers it where they meet. -->
  <use href="#tile" fill="none" stroke="#000" stroke-opacity=".1" stroke-width=".6" transform="translate(.3 .3) scale(.994)"/>
  <g clip-path="url(#clip)">
    <!-- The bot: closed, happy eyes and cheeks. -->
    <path d="M20 100V79.6C20 64 33.2 58 50 58C66.8 58 80 64 80 79.6V100Z" fill="#f0612d"/>
    <path d="M35 82q5.5-8.25 11 0M54 82q5.5-8.25 11 0" fill="none" stroke="#26282d" stroke-width="3.8" stroke-linecap="round"/>
    <ellipse cx="30" cy="90" rx="5.2" ry="3.2" fill="#ffb9a0"/>
    <ellipse cx="70" cy="90" rx="5.2" ry="3.2" fill="#ffb9a0"/>
    <!-- The arm: the hand lies along the head, the sleeve leaves by the top corner. -->
    <path d="M30 53C40 43 56 41 66 47C72 38 80 16 84-10" fill="none" stroke="#26282d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M71 9.5L88 14" stroke="#f0612d" stroke-width="5"/>
    <path d="M12 46l6 3M15 34l5 5.5" stroke="#26282d" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</svg>
